<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אריאל - שיחת וידאו עם מורה פרטי</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .mirror { transform: scaleX(-1); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-4 max-w-lg mx-auto font-sans">

  <!-- כותרת ובחירת מורה -->
  <header class="flex flex-col gap-2 py-2 border-b border-slate-800">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold text-indigo-400">🎓 שיחת וידאו עם מורה פרטי</h1>
        <p class="text-xs text-slate-400">בחר מורה ולחץ על הלחצנים למטה</p>
      </div>
      <span id="conn-status" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        מחובר
      </span>
    </div>

    <!-- גלריית מורים לבחירה -->
    <div class="flex gap-2 overflow-x-auto py-1 no-scrollbar">
      <button id="t-btn-0" type="button" class="teacher-btn border-2 border-indigo-500 rounded-xl p-1 bg-slate-800 flex items-center gap-2 min-w-[100px] transition">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" class="w-8 h-8 rounded-full object-cover">
        <span class="text-xs font-medium">אריאל</span>
      </button>
      <button id="t-btn-1" type="button" class="teacher-btn border border-slate-700 rounded-xl p-1 bg-slate-800 flex items-center gap-2 min-w-[100px] transition opacity-70">
        <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=150&q=80" class="w-8 h-8 rounded-full object-cover">
        <span class="text-xs font-medium">מיה</span>
      </button>
      <button id="t-btn-2" type="button" class="teacher-btn border border-slate-700 rounded-xl p-1 bg-slate-800 flex items-center gap-2 min-w-[100px] transition opacity-70">
        <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=150&q=80" class="w-8 h-8 rounded-full object-cover">
        <span class="text-xs font-medium">נועם</span>
      </button>
      <button id="t-btn-3" type="button" class="teacher-btn border border-slate-700 rounded-xl p-1 bg-slate-800 flex items-center gap-2 min-w-[100px] transition opacity-70">
        <img src="https://images.unsplash.com/photo-1580894732413-b7ce29a8880d?auto=format&fit=crop&w=150&q=80" class="w-8 h-8 rounded-full object-cover">
        <span class="text-xs font-medium">שירה</span>
      </button>
    </div>
  </header>

  <!-- Grid View -->
  <main class="flex-1 my-3 flex flex-col gap-3 justify-center">
    
    <!-- חלון 1: המורה -->
    <div class="relative bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 aspect-video flex flex-col items-center justify-center shadow-2xl">
      <img id="teacher-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" alt="המורה" class="w-full h-full object-cover transition-all duration-300">
      
      <!-- אינדיקטור דיבור -->
      <div id="speaking-overlay" class="absolute top-3 right-3 bg-indigo-600/90 backdrop-blur-md px-3 py-1 rounded-full text-xs font-medium text-white flex items-center gap-2 hidden shadow-lg border border-indigo-400/30">
        <span class="flex h-2 w-2 relative">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-300 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-white"></span>
        </span>
        <span id="teacher-speaking-text">מדבר/ת...</span>
      </div>

      <span id="teacher-badge" class="absolute bottom-12 right-2 bg-slate-900/80 px-2.5 py-1 rounded-lg text-xs text-indigo-200 border border-slate-700">
        👨‍🏫 אריאל (מורה פרטי)
      </span>

      <!-- כתוביות חיות -->
      <div id="captions" class="absolute bottom-2 inset-x-2 bg-slate-950/85 backdrop-blur-md p-2 rounded-xl text-center text-xs text-indigo-200 min-h-[36px] flex items-center justify-center border border-slate-800">
        לחץ על כפתור המיקרופון או המצלמה כדי להתחיל
      </div>
    </div>

    <!-- חלון 2: הילד / התלמיד -->
    <div class="relative bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 aspect-video flex items-center justify-center shadow-lg">
      <video id="user-video" autoplay playsinline muted class="w-full h-full object-cover mirror hidden"></video>
      <div id="cam-off-msg" class="flex flex-col items-center text-slate-500">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
        <span class="text-xs">המצלמה כבויה</span>
      </div>
      <span class="absolute bottom-2 right-2 bg-slate-900/80 px-2 py-0.5 rounded text-[10px] text-slate-300">אתה (תלמיד)</span>
    </div>

  </main>

  <!-- בקרות שיחה -->
  <footer class="bg-slate-800/80 backdrop-blur-md p-3 rounded-2xl border border-slate-700 flex items-center justify-around">
    
    <!-- כפתור מצלמה -->
    <button id="cam-btn" type="button" class="p-3 bg-slate-700 hover:bg-slate-600 text-white rounded-full transition shadow cursor-pointer">
      <svg class="h-6 w-6 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
      </svg>
    </button>

    <!-- כפתור מיקרופון -->
    <button id="mic-btn" type="button" class="p-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full transition shadow-lg w-16 h-16 flex items-center justify-center cursor-pointer">
      <svg class="h-8 w-8 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 016 0v6a3 3 0 01-3 3z" />
      </svg>
    </button>

  </footer>

  <script>
    const teachers = [
      { name: 'אריאל', img: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80', badge: '👨‍🏫 אריאל (מורה פרטי)' },
      { name: 'מיה', img: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=600&q=80', badge: '👩‍🏫 מיה (מורה פרטית)' },
      { name: 'נועם', img: 'https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=600&q=80', badge: '👨‍🏫 נועם (מורה פרטי)' },
      { name: 'שירה', img: 'https://images.unsplash.com/photo-1580894732413-b7ce29a8880d?auto=format&fit=crop&w=600&q=80', badge: '👩‍🏫 שירה (מורה פרטית)' }
    ];

    let currentTeacherIndex = 0;
    let isCamOn = false;
    let cameraStream = null;
    let fullResponseText = '';
    let isListening = false;

    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${location.host}`);

    const userVideo = document.getElementById('user-video');
    const camOffMsg = document.getElementById('cam-off-msg');
    const camBtn = document.getElementById('cam-btn');
    const micBtn = document.getElementById('mic-btn');
    const captions = document.getElementById('captions');
    const teacherImg = document.getElementById('teacher-img');
    const speakingOverlay = document.getElementById('speaking-overlay');
    const teacherBadge = document.getElementById('teacher-badge');
    const teacherSpeakingText = document.getElementById('teacher-speaking-text');

    // בחירת מורה
    teachers.forEach((_, index) => {
      const btn = document.getElementById(`t-btn-${index}`);
      if (btn) {
        btn.onclick = () => selectTeacher(index);
      }
    });

    function selectTeacher(index) {
      currentTeacherIndex = index;
      const t = teachers[index];
      teacherImg.src = t.img;
      teacherBadge.innerText = t.badge;
      teacherSpeakingText.innerText = `${t.name} מדבר/ת...`;

      teachers.forEach((_, idx) => {
        const btn = document.getElementById(`t-btn-${idx}`);
        if (btn) {
          btn.className = idx === index 
            ? 'teacher-btn border-2 border-indigo-500 rounded-xl p-1 bg-slate-800 flex items-center gap-2 min-w-[100px] transition opacity-100'
            : 'teacher-btn border border-slate-700 rounded-xl p-1 bg-slate-800 flex items-center gap-2 min-w-[100px] transition opacity-70';
        }
      });
    }

    // 1. הפעלת מצלמה עמידה למכשירים ניידים בדפדפנים
    camBtn.onclick = async () => {
      if (!isCamOn) {
        try {
          const constraints = { video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } };
          cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
          userVideo.srcObject = cameraStream;
          userVideo.classList.remove('hidden');
          camOffMsg.classList.add('hidden');
          camBtn.classList.replace('bg-slate-700', 'bg-emerald-600');
          isCamOn = true;
        } catch (err) {
          console.error('Camera error:', err);
          alert('לא ניתן לגשת למצלמה. אנא ודא הרשאות מצלמה בדפדפן.');
        }
      } else {
        if (cameraStream) {
          cameraStream.getTracks().forEach(track => track.stop());
          cameraStream = null;
        }
        userVideo.srcObject = null;
        userVideo.classList.add('hidden');
        camOffMsg.classList.remove('hidden');
        camBtn.classList.replace('bg-emerald-600', 'bg-slate-700');
        isCamOn = false;
      }
    };

    // 2. זיהוי דיבור
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'he-IL';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.replace('bg-indigo-600', 'bg-red-500');
        micBtn.classList.add('animate-pulse');
        captions.innerText = 'מקשיב לך... (דבר עכשיו)';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        if (transcript) {
          captions.innerText = `אתה: "${transcript}"`;
          ws.send(JSON.stringify({ type: 'text_query', text: transcript }));
        }
      };

      recognition.onerror = () => {
        stopListening();
        captions.innerText = 'לא הצלחתי לשמוע. לחץ שוב על המיקרופון.';
      };

      recognition.onend = () => {
        stopListening();
      };
    }

    function stopListening() {
      isListening = false;
      micBtn.classList.replace('bg-red-500', 'bg-indigo-600');
      micBtn.classList.remove('animate-pulse');
    }

    micBtn.onclick = () => {
      if (!recognition) return alert('הדפדפן אינו תומך בזיהוי קולי');

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      if (isListening) {
        recognition.stop();
      } else {
        try {
          recognition.start();
        } catch (e) {
          stopListening();
        }
      }
    };

    // 3. קבלת התשובה מ-Groq והשמעה
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'text_chunk') {
        if (!fullResponseText) fullResponseText = '';
        fullResponseText += data.text;
        const activeName = teachers[currentTeacherIndex].name;
        captions.innerText = `${activeName}: "${fullResponseText}"`;
      } else if (data.type === 'stream_end') {
        speakText(data.fullText || fullResponseText);
        fullResponseText = '';
      } else if (data.type === 'error') {
        captions.innerText = `שגיאה: ${data.message}`;
      }
    };

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'he-IL';

        utterance.onstart = () => {
          teacherImg.classList.add('scale-105');
          speakingOverlay.classList.remove('hidden');
        };

        utterance.onend = () => {
          teacherImg.classList.remove('scale-105');
          speakingOverlay.classList.add('hidden');
        };

        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
