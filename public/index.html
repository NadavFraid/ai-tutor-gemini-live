<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אריאל - מורה פרטי קולי</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">
  
  <!-- כותרת -->
  <header class="text-center my-4">
    <h1 class="text-2xl font-bold text-indigo-600">🎓 אריאל - מורה פרטי קולי</h1>
    <p class="text-sm text-slate-500 mt-1">פיזיקה • מתמטיקה • אנגלית (כיתה ח')</p>
  </header>

  <!-- צ'אט / תצוגת שיחה -->
  <main id="chat-box" class="flex-1 bg-white rounded-2xl p-4 shadow-sm border border-slate-200 overflow-y-auto my-2 space-y-3 min-h-[300px] max-h-[450px]">
    <div class="bg-indigo-50 p-3 rounded-xl text-indigo-900 text-sm">
      שלום! אני אריאל. לחץ על כפתור המיקרופון ודבר איתי, או הקלד שאלה!
    </div>
  </main>

  <!-- אזור שליטה: מיקרופון והקלדה -->
  <footer class="mt-2 space-y-3">
    <!-- כפתור שיחה קולית ראשית -->
    <div class="flex justify-center">
      <button id="mic-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-full p-5 shadow-lg transition flex items-center justify-center w-20 h-20">
        <svg id="mic-icon" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 016 0v6a3 3 0 01-3 3z" />
        </svg>
      </button>
    </div>
    <p id="status-text" class="text-center text-xs text-slate-500">לחץ על המיקרופון כדי להקליט</p>

    <!-- טופס הקלדה כגיבוי -->
    <form id="input-form" class="flex gap-2">
      <input type="text" id="user-input" placeholder="או הקלד שאלה כאן..." class="flex-1 border border-slate-300 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <button type="submit" id="send-btn" class="bg-slate-800 text-white font-medium px-4 py-2 rounded-xl text-sm hover:bg-slate-900 transition">שלח</button>
    </form>
  </footer>

  <script>
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${location.host}`);
    const chatBox = document.getElementById('chat-box');
    const form = document.getElementById('input-form');
    const input = document.getElementById('user-input');
    const micBtn = document.getElementById('mic-btn');
    const statusText = document.getElementById('status-text');

    let currentBotMsgElement = null;
    let fullResponseText = '';

    // זיהוי דיבור (Speech Recognition)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'he-IL';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
        micBtn.classList.add('bg-red-500', 'animate-pulse');
        statusText.innerText = 'מקשיב לך... (דבר עכשיו)';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        if (transcript) {
          sendQuery(transcript);
        }
      };

      recognition.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
        stopListening();
        statusText.innerText = 'לא הצלחתי לשמוע, נסה שוב או הקלד.';
      };

      recognition.onend = () => {
        stopListening();
      };
    } else {
      statusText.innerText = 'הדפדפן אינו תומך בזיהוי קולי, ניתן להקליד כרגיל.';
    }

    function stopListening() {
      isListening = false;
      micBtn.classList.remove('bg-red-500', 'animate-pulse');
      micBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
      statusText.innerText = 'לחץ על המיקרופון כדי לדבר';
    }

    micBtn.addEventListener('click', () => {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        window.speechSynthesis.cancel();
        recognition.start();
      }
    });

    // תקשורת WebSocket
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'text_chunk') {
        if (!currentBotMsgElement) {
          currentBotMsgElement = createMessageElement('אריאל', '', 'bg-indigo-50 text-indigo-900');
          fullResponseText = '';
        }
        currentBotMsgElement.innerHTML += data.text.replace(/\n/g, '<br>');
        fullResponseText += data.text;
        chatBox.scrollTop = chatBox.scrollHeight;
      } else if (data.type === 'stream_end') {
        speakText(data.fullText || fullResponseText);
        currentBotMsgElement = null;
      } else if (data.type === 'error') {
        createMessageElement('מערכת', data.message, 'bg-red-50 text-red-800');
      }
    };

    function sendQuery(text) {
      createMessageElement('אתה', text, 'bg-slate-100 text-slate-800');
      ws.send(JSON.stringify({ type: 'text_query', text }));
      statusText.innerText = 'אריאל חושב...';
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      window.speechSynthesis.cancel();
      sendQuery(text);
      input.value = '';
    });

    function createMessageElement(sender, text, bgClass) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `p-3 rounded-xl text-sm ${bgClass}`;
      msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    // הקראת טקסט (Text-to-Speech)
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'he-IL';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
