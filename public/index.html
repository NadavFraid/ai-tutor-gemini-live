<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אריאל - שיחת וידאו חי (Gemini Live)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .mirror { transform: scaleX(-1); }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-4 max-w-lg mx-auto font-sans">

  <!-- כותרת -->
  <header class="flex justify-between items-center py-2 border-b border-slate-800">
    <div>
      <h1 class="text-lg font-bold text-indigo-400">🎓 שיחת וידאו עם אריאל</h1>
      <p class="text-xs text-slate-400">Gemini Multimodal Live API</p>
    </div>
    <span id="conn-status" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">
      <span class="w-2 h-2 rounded-full bg-amber-500"></span>
      מתחבר...
    </span>
  </header>

  <!-- מסך וידאו מפוצל (Grid View) -->
  <main class="flex-1 my-4 flex flex-col gap-3 justify-center">
    
    <!-- חלון 1: המורה אריאל (AI Avatar) -->
    <div class="relative bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 aspect-video flex flex-col items-center justify-center shadow-2xl">
      <div class="relative flex flex-col items-center">
        <div id="avatar-circle" class="w-28 h-28 rounded-full bg-indigo-600/30 flex items-center justify-center transition-all duration-300">
          <div class="w-24 h-24 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-4xl shadow-inner border-2 border-indigo-400/50">
            👨‍🏫
          </div>
        </div>
        <span class="mt-3 text-sm font-semibold text-slate-200">אריאל - מורה פרטי</span>
        <span id="teacher-state" class="text-xs text-slate-400 mt-0.5">בהמתנה...</span>
      </div>

      <!-- כתוביות חיות -->
      <div id="captions" class="absolute bottom-2 inset-x-2 bg-slate-950/80 backdrop-blur-md p-2 rounded-xl text-center text-xs text-indigo-200 min-h-[36px] flex items-center justify-center border border-slate-800">
        לחץ על המיקרופון כדי להתחיל לדבר עם אריאל
      </div>
    </div>

    <!-- חלון 2: הילד / התלמיד (Local Video & Frame Capture) -->
    <div class="relative bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 aspect-video flex items-center justify-center shadow-lg">
      <video id="user-video" autoplay playsinline muted class="w-full h-full object-cover mirror hidden"></video>
      <canvas id="frame-canvas" class="hidden"></canvas>
      <div id="cam-off-msg" class="flex flex-col items-center text-slate-500">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
        <span class="text-xs">לחץ על כפתור המצלמה להפעלת וידאו</span>
      </div>
      <span class="absolute bottom-2 right-2 bg-slate-900/80 px-2 py-0.5 rounded text-[10px] text-slate-300">אתה (תלמיד)</span>
    </div>

  </main>

  <!-- בקרות שיחה -->
  <footer class="bg-slate-800/80 backdrop-blur-md p-3 rounded-2xl border border-slate-700 flex items-center justify-around">
    
    <!-- הפעלת/כיבוי מצלמה -->
    <button id="cam-btn" class="p-3 bg-slate-700 hover:bg-slate-600 text-white rounded-full transition shadow">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
      </svg>
    </button>

    <!-- הפעלת/הקפאת מיקרופון -->
    <button id="mic-btn" class="p-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full transition shadow-lg w-16 h-16 flex items-center justify-center">
      <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 016 0v6a3 3 0 01-3 3z" />
      </svg>
    </button>

  </footer>

  <script>
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${location.host}`);

    const connStatus = document.getElementById('conn-status');
    const userVideo = document.getElementById('user-video');
    const camOffMsg = document.getElementById('cam-off-msg');
    const camBtn = document.getElementById('cam-btn');
    const micBtn = document.getElementById('mic-btn');
    const captions = document.getElementById('captions');
    const teacherState = document.getElementById('teacher-state');
    const avatarCircle = document.getElementById('avatar-circle');
    const canvas = document.getElementById('frame-canvas');

    let isCamOn = false;
    let mediaStream = null;
    let audioContext = null;
    let processor = null;
    let frameInterval = null;

    ws.onopen = () => {
      connStatus.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
      connStatus.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>מחובר בלייב';
    };

    // הפעלת המצלמה והזרמת פריימים (Video Stream Capture)
    camBtn.addEventListener('click', async () => {
      if (!isCamOn) {
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          userVideo.srcObject = mediaStream;
          userVideo.classList.remove('hidden');
          camOffMsg.classList.add('hidden');
          camBtn.classList.replace('bg-slate-700', 'bg-emerald-600');
          isCamOn = true;

          // הזרמת פריים מכל 1000ms ל-Gemini
          frameInterval = setInterval(sendVideoFrame, 1000);
          startAudioStreaming(mediaStream);
        } catch (err) {
          alert('אישור המצלמה/המיקרופון נדרש לשיחת הוידאו');
        }
      } else {
        stopStreaming();
      }
    });

    function stopStreaming() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
      }
      clearInterval(frameInterval);
      userVideo.classList.add('hidden');
      camOffMsg.classList.remove('hidden');
      camBtn.classList.replace('bg-emerald-600', 'bg-slate-700');
      isCamOn = false;
    }

    function sendVideoFrame() {
      if (!isCamOn || ws.readyState !== WebSocket.OPEN) return;
      const ctx = canvas.getContext('2d');
      canvas.width = 320;
      canvas.height = 240;
      ctx.drawImage(userVideo, 0, 0, canvas.width, canvas.height);
      const base64Data = canvas.toDataURL('image/jpeg', 0.5).split(',')[1];

      ws.send(JSON.stringify({
        type: 'realtime_input',
        mimeType: 'image/jpeg',
        data: base64Data
      }));
    }

    // הזרמת PCM Audio בלייב לשרת
    function startAudioStreaming(stream) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      const source = audioContext.createMediaStreamSource(stream);
      processor = audioContext.createScriptProcessor(2048, 1, 1);

      processor.onaudioprocess = (e) => {
        if (ws.readyState !== WebSocket.OPEN) return;
        const inputData = e.inputBuffer.getChannelData(0);
        // המרה ל-PCM 16Bit
        const pcm16 = new Int16Array(inputData.length);
        for (let i = 0; i < inputData.length; i++) {
          pcm16[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
        }
        const base64Audio = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
        
        ws.send(JSON.stringify({
          type: 'realtime_input',
          mimeType: 'audio/pcm;rate=16000',
          data: base64Audio
        }));
      };

      source.connect(processor);
      processor.connect(audioContext.destination);
    }

    // ניגון תשובת האודיו שחוזרת מ-Gemini Live
    let audioQueue = [];
    let isPlaying = false;

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'text_chunk') {
        captions.innerText = `אריאל: "${data.text}"`;
        teacherState.innerText = 'מדבר...';
        avatarCircle.classList.add('scale-110', 'ring-4', 'ring-indigo-500/50');
      } else if (data.type === 'audio_chunk') {
        playAudioBuffer(data.data);
      } else if (data.type === 'turn_complete') {
        teacherState.innerText = 'מקשיב...';
        avatarCircle.classList.remove('scale-110', 'ring-4', 'ring-indigo-500/50');
      }
    };

    function playAudioBuffer(base64Data) {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const binary = atob(base64Data);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      
      const int16 = new Int16Array(bytes.buffer);
      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768.0;

      const buffer = audioContext.createBuffer(1, float32.length, 24000);
      buffer.getChannelData(0).set(float32);

      const src = audioContext.createBufferSource();
      src.buffer = buffer;
      src.connect(audioContext.destination);
      src.start();
    }
  </script>
</body>
</html>
