<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אריאל - שיחת וידאו עם מורה פרטי</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .mirror { transform: scaleX(-1); }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-4 max-w-lg mx-auto font-sans">

  <!-- כותרת -->
  <header class="flex justify-between items-center py-2 border-b border-slate-800">
    <div>
      <h1 class="text-lg font-bold text-indigo-400">🎓 שיחת וידאו עם אריאל</h1>
      <p class="text-xs text-slate-400">פיזיקה • מתמטיקה • אנגלית (כיתה ח')</p>
    </div>
    <span id="conn-status" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      מחובר
    </span>
  </header>

  <!-- Grid Layout -->
  <main class="flex-1 my-4 flex flex-col gap-3 justify-center">
    
    <!-- חלון 1: המורה אריאל (Canvas Animated Avatar) -->
    <div class="relative bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 aspect-video flex flex-col items-center justify-center shadow-2xl">
      
      <!-- Canvas Avatar Layer -->
      <canvas id="avatar-canvas" width="300" height="180" class="w-full h-full object-cover"></canvas>

      <!-- כתוביות חיות -->
      <div id="captions" class="absolute bottom-2 inset-x-2 bg-slate-950/80 backdrop-blur-md p-2 rounded-xl text-center text-xs text-indigo-200 min-h-[36px] flex items-center justify-center border border-slate-800">
        לחץ על כפתור המיקרופון כדי לדבר עם אריאל
      </div>
    </div>

    <!-- חלון 2: הילד / התלמיד (Local Video Camera) -->
    <div class="relative bg-slate-800 rounded-2xl overflow-hidden border border-slate-700 aspect-video flex items-center justify-center shadow-lg">
      <video id="user-video" autoplay playsinline muted class="w-full h-full object-cover mirror hidden"></video>
      <div id="cam-off-msg" class="flex flex-col items-center text-slate-500">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
        <span class="text-xs">המצלמה שלך כבויה</span>
      </div>
      <span class="absolute bottom-2 right-2 bg-slate-900/80 px-2 py-0.5 rounded text-[10px] text-slate-300">אתה (תלמיד)</span>
    </div>

  </main>

  <!-- בקרות שיחה -->
  <footer class="bg-slate-800/80 backdrop-blur-md p-3 rounded-2xl border border-slate-700 flex items-center justify-around">
    
    <!-- כפתור מצלמה -->
    <button id="cam-btn" class="p-3 bg-slate-700 hover:bg-slate-600 text-white rounded-full transition shadow">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
      </svg>
    </button>

    <!-- כפתור מיקרופון -->
    <button id="mic-btn" class="p-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full transition shadow-lg w-16 h-16 flex items-center justify-center">
      <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 016 0v6a3 3 0 01-3 3z" />
      </svg>
    </button>

  </footer>

  <script>
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${location.host}`);

    const userVideo = document.getElementById('user-video');
    const camOffMsg = document.getElementById('cam-off-msg');
    const camBtn = document.getElementById('cam-btn');
    const micBtn = document.getElementById('mic-btn');
    const captions = document.getElementById('captions');
    const avatarCanvas = document.getElementById('avatar-canvas');
    const ctx = avatarCanvas.getContext('2d');

    let isCamOn = false;
    let cameraStream = null;
    let isSpeaking = false;
    let fullResponseText = '';

    // --- 1. ציור ואנימציית Canvas Avatar ל-אריאל ---
    let animFrameId = null;
    let mouthOpening = 0;

    function drawAvatar() {
      ctx.clearRect(0, 0, avatarCanvas.width, avatarCanvas.height);

      // רקע מודרני
      const gradient = ctx.createLinearGradient(0, 0, 0, avatarCanvas.height);
      gradient.addColorStop(0, '#1e1b4b');
      gradient.addColorStop(1, '#0f172a');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, avatarCanvas.width, avatarCanvas.height);

      const centerX = avatarCanvas.width / 2;
      const centerY = avatarCanvas.height / 2 - 10;

      // הילה מונפשת סביב הראש בזמן דיבור
      if (isSpeaking) {
        mouthOpening = Math.sin(Date.now() / 100) * 12 + 14;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 55 + Math.sin(Date.now() / 150) * 4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(99, 102, 241, 0.25)';
        ctx.fill();
      } else {
        mouthOpening = 4;
      }

      // ראש
      ctx.beginPath();
      ctx.arc(centerX, centerY, 45, 0, Math.PI * 2);
      ctx.fillStyle = '#6366f1';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#818cf8';
      ctx.stroke();

      // עיניים
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(centerX - 16, centerY - 10, 7, 0, Math.PI * 2);
      ctx.arc(centerX + 16, centerY - 10, 7, 0, Math.PI * 2);
      ctx.fill();

      // אישונים
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(centerX - 16, centerY - 10, 3, 0, Math.PI * 2);
      ctx.arc(centerX + 16, centerY - 10, 3, 0, Math.PI * 2);
      ctx.fill();

      // פה מונפש בזמן אמת
      ctx.beginPath();
      ctx.ellipse(centerX, centerY + 16, 12, Math.max(2, mouthOpening / 2), 0, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // תווית שם
      ctx.font = 'bold 12px sans-serif';
      ctx.fillStyle = '#c7d2fe';
      ctx.textAlign = 'center';
      ctx.fillText(isSpeaking ? 'אריאל מדבר...' : 'אריאל (מורה פרטי)', centerX, avatarCanvas.height - 15);

      animFrameId = requestAnimationFrame(drawAvatar);
    }

    drawAvatar();

    // --- 2. מנגנון הפעלת מצלמה (מבודד) ---
    camBtn.addEventListener('click', async () => {
      if (!isCamOn) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
          userVideo.srcObject = cameraStream;
          userVideo.classList.remove('hidden');
          camOffMsg.classList.add('hidden');
          camBtn.classList.replace('bg-slate-700', 'bg-emerald-600');
          isCamOn = true;
        } catch (err) {
          alert('אנא אשר הרשאת גישה למצלמה בדפדפן');
        }
      } else {
        if (cameraStream) {
          cameraStream.getTracks().forEach(track => track.stop());
        }
        userVideo.classList.add('hidden');
        camOffMsg.classList.remove('hidden');
        camBtn.classList.replace('bg-emerald-600', 'bg-slate-700');
        isCamOn = false;
      }
    });

    // --- 3. זיהוי דיבור (Speech Recognition) ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'he-IL';

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.replace('bg-indigo-600', 'bg-red-500');
        micBtn.classList.add('animate-pulse');
        captions.innerText = 'מקשיב... (דבר עכשיו)';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        if (transcript) {
          captions.innerText = `אתה: "${transcript}"`;
          ws.send(JSON.stringify({ type: 'text_query', text: transcript }));
        }
      };

      recognition.onerror = () => {
        captions.innerText = 'לא הצלחתי לשמוע, לחץ על המיקרופון ונסה שוב.';
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.replace('bg-red-500', 'bg-indigo-600');
        micBtn.classList.remove('animate-pulse');
      };
    }

    micBtn.addEventListener('click', () => {
      if (!recognition) return alert('הדפדפן אינו תומך בזיהוי קולי');
      if (isListening) {
        recognition.stop();
      } else {
        window.speechSynthesis.cancel();
        recognition.start();
      }
    });

    // --- 4. קבלת תשובות והפעלת האודיו והאנימציה ---
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'text_chunk') {
        if (!fullResponseText) fullResponseText = '';
        fullResponseText += data.text;
        captions.innerText = `אריאל: "${fullResponseText}"`;
      } else if (data.type === 'stream_end') {
        speakText(data.fullText || fullResponseText);
        fullResponseText = '';
      }
    };

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'he-IL';

        utterance.onstart = () => {
          isSpeaking = true;
        };

        utterance.onend = () => {
          isSpeaking = false;
        };

        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
